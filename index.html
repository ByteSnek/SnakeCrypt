<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="./styles/style.css" />
        <title>SnakeCrypt</title>
    </head>

    <body>
        <main class="container">
            <section class="text-center m-4">
                <h1 class="neue-hxt text-white">SnakeCrypt Codec</h1>
                <h5 class="neue-lxt text-kinda-white">A custom radix based Encryption/Decryption program</h5>
            </section>
            <section class="neue-lxt gradient-border">
                <div class="mb-3">
                    <textarea rows="5" class="form-control" id="input" placeholder="Input"></textarea>
                </div>
                <div class="mb-3">
                    <textarea rows="5" class="form-control" readonly id="output" placeholder="Output"></textarea>
                </div>
                <div class="mt-3">
                    <button class="btn btn-primary" id="encrypt" onclick="encryptInput()" disabled>Encrypt</button>
                    <button class="btn btn-primary" id="decrypt" onclick="decryptInput()" disabled>Decrypt</button>
                </div>
                <div class="mt-3">
                    <button class="btn btn-info" id="copy" onclick="copyOutput()" disabled>Copy</button>
                    <button class="btn btn-info" id="download" onclick="downloadOutput()" disabled>Download</button>
                    <button class="btn btn-danger" id="clear" onclick="clearFields()" disabled>Clear</button>
                </div>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
        <script src="./scripts/index.js" type="module"></script>
    </body>
</html>
